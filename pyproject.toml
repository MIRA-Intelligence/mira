[project]
name = "mira-engine"
dynamic = ["version"]
description = "A lightweight personal AI assistant framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "mira contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "litellm>=1.81.5,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "oauth-cli-kit>=0.1.3,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "dingtalk-stream>=0.24.0,<1.0.0",
    "python-telegram-bot[socks]>=22.6,<23.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "socksio>=1.0.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "ddgs>=9.0.0,<10.0.0",
    "psutil>=6.0.0",
    "questionary>=2.1.1,<3.0.0",
    "filelock>=3.13.0,<4.0.0",
    "uv>=0.5.0",
    "jieba>=0.42.1,<1.0.0",
    "pypdf>=5.0.0,<7.0.0",
]

[project.optional-dependencies]
# Mira Server (mira_server/, `mira-server` command). Linux hosts only in production.
server = [
    "aiohttp>=3.10.0,<4.0.0",
    "python-pam>=2.0.2,<3.0.0; sys_platform != 'win32'",
]
matrix = [
    "matrix-nio[e2e]>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]
dev = [
    "aiohttp>=3.10.0,<4.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.1.0",
    "matrix-nio[e2e]>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]

[project.scripts]
mira = "mira_engine.cli.commands:app"
mira-engine = "mira_engine.cli.agent_service:app"
mira-server = "mira_server.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:rc\\d+)?)$"
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["mira_engine", "mira_server"]

[tool.hatch.build.targets.wheel.sources]
"mira_engine" = "mira_engine"
"mira_server" = "mira_server"

# Deployment files (PAM services, unit, policy, installer) for `mira-server deploy-dir`.
[tool.hatch.build.targets.wheel.force-include]
"deploy/mira-server" = "mira_server/deploy"
# First-party plugins, loaded by the plugin kernel (mira_engine/plugins).
"plugins" = "mira_engine/_bundled_plugins"

# Include non-Python files in skills and templates
[tool.hatch.build]
include = [
    "mira_engine/**/*.py",
    "mira_server/**/*.py",
    "mira_engine/templates/**/*.md",
    "mira_engine/skills/**/*.md",
    "mira_engine/skills/**/*.sh",
]
# The skills submodule also carries the MIRA Hub catalogue; only builtin_skills/ ships.
exclude = ["mira_engine/skills/skills/**"]

[tool.hatch.build.targets.sdist]
include = [
    "mira_engine/",
    "mira_server/",
    "deploy/mira-server/",
    "plugins/",
    "bridge/",
    "README.md",
    "LICENSE",
]


[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mira_engine/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mira_engine"]
omit = [
    "mira_engine/skills/*",
    "mira_engine/cli/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
]
