pipeline: radiomics
version: "1.0"
study:
  modality: "CT"
  clinical_endpoint: "survival"
paths:
  images_dir: "./data/images"
  masks_dir: "./data/masks"
  output_dir: "./results"
extraction:
  resample_spacing: [1.0, 1.0, 1.0]
  interpolator: "sitkBSpline"
  bin_width: 25
  extractors:
    - shape
    - firstorder
    - glcm
    - glrlm
    - glszm
feature_selection:
  icc_threshold: 0.75
  correlation_threshold: 0.85
  method: "lasso"
modeling:
  classifier: "logistic_regression"
