# pipeline_plan.yaml (Single Source of Truth)
# This file must be generated by Agent 0 and updated automatically by Agent 4 (or manually by the user).

project:
  name: "Medical_Imaging_Task"
  task_type: "Segmentation"  # Options: Classification, Segmentation, Detection, Registration
  description: "Brief description of the clinical objective here."

network_io:
  input_modalities: ["CT"]   # e.g., ["T1", "T1ce", "T2", "FLAIR"], ["X-ray"]
  output_classes: 2          # Number of classification or segmentation classes (including background)
  class_names: ["background", "target_lesion"]
  spatial_dims: 3            # 2 (for 2D slices) or 3 (for 3D volumes)
  patch_size: [96, 96, 96]   # The input patch/image size fed into the network

data_organization:
  split_strategy: "5-Fold-CV" # Options: 5-Fold-CV, Hold-out
  stratification: true
  test_ratio: 0.2            # Only used if Hold-out

preprocessing:
  target_spacing: [1.0, 1.0, 1.0] 
  intensity_normalization: "z-score" # Options: z-score, standard_scaler, min-max, clip
  roi_crop: true                     # E.g., true for CropForegroundd
  bias_field_correction: false       # N4BiasFieldCorrection (common for MRI)
  augmentations:
    RandSpatialCropd:
      roi_size: [96, 96, 96]
      random_size: false
    RandFlipd:
      prob: 0.5
      spatial_axis: [0, 1, 2]
    RandScaleIntensityd:
      factors: 0.1
      prob: 0.5
    RandShiftIntensityd:
      offsets: 0.1
      prob: 0.5
    RandGaussianNoised:
      prob: 0.1

architecture:
  backbone: "UNet"           # Options: UNet, nnUNet, ResNet, Swin-UNETR, ViT...
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  dropout: 0.1               # Increase if Overfitting is diagnosed

training:
  loss_function: "DiceFocalLoss"  # Options: DiceLoss, CrossEntropy, BCEWithLogits, GeneralizedDiceLoss...
  loss_params:
    include_background: false
    to_onehot_y: true
    softmax: true
  optimizer: "AdamW"
  learning_rate: 1e-4
  weight_decay: 1e-5
  batch_size: 2
  max_epochs: 300
  early_stopping_patience: 50
  val_interval: 2

testing:
  primary_metric: "Mean_Dice"     # Metric used to decide PASS or REJECT
  secondary_metrics: ["HD95", "Sensitivity", "Specificity"]
