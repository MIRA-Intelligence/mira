x-common-config: &common-config
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  volumes:
    - ~/.medpilot:/home/medpilot/.medpilot
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined

services:
  # Local build/run stack (uses repository Dockerfile)
  medpilot-gateway:
    container_name: medpilot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 18790:18790
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  medpilot-api:
    container_name: medpilot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/medpilot/.medpilot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  medpilot-cli:
    <<: *common-config
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BUILD_BRIDGE: "0"
    user: "479001138:479001138"
    environment:
      - MEDPILOT_CONFIG_PATH=/home/medpilot/.medpilot/config.json
      - XDG_CONFIG_HOME=/home/medpilot/.medpilot/.config
      - XDG_DATA_HOME=/home/medpilot/.medpilot/.local/share
      - XDG_CACHE_HOME=/home/medpilot/.medpilot/.cache
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true

  # Optional self-hosted release stack
  medpilot-agent:
    image: ghcr.io/project-medpilot/medpilot-agent:${MEDPILOT_AGENT_TAG:-latest}
    container_name: medpilot-agent
    profiles:
      - self-hosted
    restart: unless-stopped
    command: ["medpilot", "gateway", "--port", "18790"]
    ports:
      - "${MEDPILOT_AGENT_PORT:-18790}:18790"
    volumes:
      - medpilot_data:/root/.medpilot
    environment:
      - MEDPILOT_CONFIG_PATH=/root/.medpilot/config.json

  medpilot-ui:
    image: ghcr.io/project-medpilot/medpilot-ui:${MEDPILOT_UI_TAG:-latest}
    container_name: medpilot-ui
    profiles:
      - self-hosted
    restart: unless-stopped
    depends_on:
      - medpilot-agent
    ports:
      - "${MEDPILOT_UI_PORT:-8080}:80"
    environment:
      - VITE_API_URL=${MEDPILOT_API_URL:-http://localhost:18790/api}
      - VITE_WS_URL=${MEDPILOT_WS_URL:-ws://localhost:18790/ws}

volumes:
  medpilot_data:
