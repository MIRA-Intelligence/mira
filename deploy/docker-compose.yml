x-common-config: &common-config
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  volumes:
    - ~/.mira:/home/mira/.mira
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined

services:
  # Local build/run stack (uses repository Dockerfile)
  mira-gateway:
    container_name: mira-gateway
    <<: *common-config
    # The gateway binds 127.0.0.1 by default; inside a container it must listen on
    # all interfaces. Every non-probe request still needs the gateway token
    # (`docker compose exec mira-gateway mira gateway-token`).
    command: ["gateway", "--host", "0.0.0.0"]
    restart: unless-stopped
    environment:
      - MIRA_GATEWAY_TOKEN=${MIRA_GATEWAY_TOKEN:-}
      - MIRA_GATEWAY_ALLOWED_ORIGINS=${MIRA_GATEWAY_ALLOWED_ORIGINS:-}
    ports:
      - 18790:18790
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  mira-api:
    container_name: mira-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/mira/.mira/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  mira-cli:
    <<: *common-config
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BUILD_BRIDGE: "0"
    user: "479001138:479001138"
    environment:
      - MIRA_CONFIG_PATH=/home/mira/.mira/config.json
      - XDG_CONFIG_HOME=/home/mira/.mira/.config
      - XDG_DATA_HOME=/home/mira/.mira/.local/share
      - XDG_CACHE_HOME=/home/mira/.mira/.cache
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true

  # Optional self-hosted release stack
  mira-engine:
    image: ghcr.io/mira-intelligence/mira-engine:${MIRA_AGENT_TAG:-latest}
    container_name: mira-engine
    profiles:
      - self-hosted
    restart: unless-stopped
    # Listen on all interfaces inside the container; access requires the gateway token.
    command: ["mira", "gateway", "--host", "0.0.0.0", "--port", "18790"]
    ports:
      - "${MIRA_AGENT_PORT:-18790}:18790"
    volumes:
      - mira_data:/root/.mira
    environment:
      - MIRA_CONFIG_PATH=/root/.mira/config.json
      # Optional fixed token; when empty the engine generates /root/.mira/runtime/gateway-token.
      - MIRA_GATEWAY_TOKEN=${MIRA_GATEWAY_TOKEN:-}
      # Browser origins of the mira-ui container below; update when MIRA_UI_PORT or the host changes.
      - MIRA_GATEWAY_ALLOWED_ORIGINS=${MIRA_GATEWAY_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}

  mira-ui:
    image: ghcr.io/mira-intelligence/mira-ui:${MIRA_UI_TAG:-latest}
    container_name: mira-ui
    profiles:
      - self-hosted
    restart: unless-stopped
    depends_on:
      - mira-engine
    ports:
      - "${MIRA_UI_PORT:-8080}:80"
    environment:
      - VITE_API_URL=${MIRA_API_URL:-http://localhost:18790/api}
      - VITE_WS_URL=${MIRA_WS_URL:-ws://localhost:18790/ws}

volumes:
  mira_data:
