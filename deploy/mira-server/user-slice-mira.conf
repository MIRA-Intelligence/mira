# /etc/systemd/system/user-.slice.d/50-mira.conf - per-user resource limits.
#
# Applies to every user's slice (user-<uid>.slice): their SSH sessions and the
# engines Mira Server starts (through the mira-engine PAM session) share one
# budget. For one user only, use /etc/systemd/system/user-<uid>.slice.d/.
# Apply with `sudo systemctl daemon-reload`; running slices pick it up.
[Slice]
MemoryMax=16G
MemorySwapMax=0
CPUQuota=400%
TasksMax=4096
