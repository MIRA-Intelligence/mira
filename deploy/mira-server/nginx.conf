# Mira Server behind nginx. Copy to /etc/nginx/conf.d/mira-server.conf (http
# context), replace mira.example.com and the certificate paths, then
# `nginx -t && systemctl reload nginx`.
#
# Image, download and WebSocket URLs carry the access token as ?access_token=,
# so the access log below records the path ($uri) and never the query string
# ($request and $request_uri include it; the default "combined" format uses
# $request). In mira-server.toml set trusted_proxies = ["127.0.0.1", "::1"].

log_format mira_server '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_user_agent"';

map $http_upgrade $mira_server_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mira.example.com;

    ssl_certificate     /etc/ssl/mira-server/fullchain.pem;
    ssl_certificate_key /etc/ssl/mira-server/privkey.pem;

    access_log /var/log/nginx/mira-server.access.log mira_server;

    # File uploads go through /api/*.
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/ws, /ws/*).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mira_server_connection;
        # Streaming responses (chat, SSE) and uploads pass through unbuffered.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mira.example.com;
    access_log /var/log/nginx/mira-server.access.log mira_server;
    return 301 https://$host$request_uri;
}
