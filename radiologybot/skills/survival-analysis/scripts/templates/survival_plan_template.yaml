pipeline: survival-analysis
version: "1.0"
data:
  features_path: "./data.csv"
  clinical_path: null
endpoints:
  time_col: "survival_time"
  event_col: "status"
modeling:
  type: "cox_ph"
  alpha: 0.1
evaluation:
  metrics: ["c_index", "brier_score"]
  time_horizons: [365, 1095, 1825] # e.g. 1yr, 3yr, 5yr in days
