name: Tests

on:
  push:
    branches:
      - main
      - dev
      - release
      # Community landing branch: its CI judges every bot merge before the
      # next one, and a red merge is reverted (mira-community#51/#52).
      - contrib
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: tests (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # bubblewrap: the agent sandbox tests run it for real (tests/tools/test_sandbox.py).
          sudo apt-get install -y -qq bubblewrap
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check mira_engine mira_server --select F401,F841

      - name: Allow bwrap to create user namespaces (Ubuntu AppArmor)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          ls /etc/apparmor.d /usr/share/apparmor/extra-profiles 2>/dev/null | grep -i bwrap || true
          sudo install -m 0644 deploy/mira-server/apparmor-bwrap /etc/apparmor.d/mira-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/mira-bwrap
          bwrap --ro-bind / / --unshare-pid --proc /proc true && echo "bwrap works"

      - name: Run tests with coverage
        env:
          MIRA_REQUIRE_BWRAP: "1"
          # Every bundled plugin's SDK is installed (dev extra): a skipped contract is a failure.
          MIRA_ALL_PLUGIN_SDKS: "1"
        run: |
          python -m pytest tests/ \
            --cov=mira_engine \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sandbox-macos:
    # The Seatbelt sandbox for experimental plugins (sandbox-exec) only exists
    # on macOS; this job enforces it for real. Everything else runs on Linux.
    runs-on: macos-latest
    name: plugin sandbox (macOS)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio

      - name: Run the sandbox tests
        run: python -m pytest tests/plugins/test_isolation.py tests/tools/test_sandbox.py -v

  tests-windows:
    # The release build (agent-release.yml) runs the whole suite on Windows
    # with the bare package installed; this job is that run, on every PR,
    # so a tag build cannot be the first time a test meets Windows. Hangs
    # fail at the per-test timeout instead of stalling the job.
    runs-on: windows-latest
    name: tests (windows, release deps)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (as the release build does)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-timeout aiohttp

      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider --timeout=120 --timeout-method=thread -rfE --durations=25
