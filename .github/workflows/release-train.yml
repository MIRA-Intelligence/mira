name: Release Train

on:
  workflow_dispatch:
    inputs:
      agent_tag:
        description: "Published engine tag (e.g. v0.3.5rc1)"
        required: true
        type: string
      ui_tag:
        description: "Published UI tag (e.g. v0.4.5rc1)"
        required: true
        type: string

permissions:
  contents: read

env:
  AGENT_TAG: ${{ inputs.agent_tag }}
  UI_TAG: ${{ inputs.ui_tag }}
  GH_TOKEN: ${{ secrets.RELEASE_TRAIN_GH_TOKEN || github.token }}

jobs:
  verify-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify published releases, assets and compatibility mapping
        run: python scripts/verify_release_pair.py --agent-tag "$AGENT_TAG" --ui-tag "$UI_TAG" --output release-pair.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-pair
          path: release-pair.json

  smoke:
    needs: verify-tags
    runs-on: ubuntu-latest
    steps:
      # The harness (scripts/release_train_smoke.py) comes from this workflow's
      # ref, so harness fixes apply to tags already published; what is tested
      # is the engine binary downloaded from the agent_tag release below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set isolated gateway paths on the runner
        run: |
          echo "MIRA_HOME=$RUNNER_TEMP/mira-release-train" >> "$GITHUB_ENV"
          echo "MIRA_CONFIG_PATH=$RUNNER_TEMP/mira-release-train/config.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify the published engine
        run: |
          mkdir engine-assets
          gh release download "$AGENT_TAG" --repo MIRA-Intelligence/mira \
            --pattern mira-engine-linux-x86_64 --pattern SHA256SUMS.txt --dir engine-assets
          (cd engine-assets && sha256sum --ignore-missing --check SHA256SUMS.txt)
          chmod +x engine-assets/mira-engine-linux-x86_64
      - name: Build isolated gateway config
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["MIRA_HOME"])
          root.mkdir(parents=True, exist_ok=True)
          config = {
              "agents": {"defaults": {"workspace": str(root / "workspace"), "provider": "custom", "model": "custom/test-model"}},
              "providers": {"custom": {"apiKey": "no-key", "apiBase": "http://127.0.0.1:9/v1"}},
              "channels": {"ui": {"enabled": True, "allowFrom": ["*"], "corsOrigins": ["*"]}},
          }
          Path(os.environ["MIRA_CONFIG_PATH"]).write_text(json.dumps(config), encoding="utf-8")
          PY
      - name: Start published gateway and run smoke checks
        run: |
          # The gateway requires a token on /api/*; the smoke script reads the same variable.
          export MIRA_GATEWAY_TOKEN="release-train-smoke-$GITHUB_RUN_ID"
          engine-assets/mira-engine-linux-x86_64 run-gateway --host 127.0.0.1 --port 18790 > gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID" 2>/dev/null || true' EXIT
          healthy=false
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:18790/health >/dev/null; then healthy=true; break; fi
            kill -0 "$GATEWAY_PID" || break
            sleep 2
          done
          if [ "$healthy" != true ]; then tail -n 200 gateway.log; exit 1; fi
          python scripts/release_train_smoke.py --base-url http://127.0.0.1:18790 \
            --expected-agent "${AGENT_TAG#v}" --expected-contract v1 > smoke-report.json
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-train-smoke-${{ inputs.agent_tag }}-${{ inputs.ui_tag }}
          path: |
            smoke-report.json
            gateway.log

  summary:
    needs: [verify-tags, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-pair
      - name: Build release summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("release-pair.json").read_text())
          text = "## Release Train Verified\n\n"
          text += f"- Engine: {report['agent_tag']} ({report['agent_commit']})\n"
          text += f"- UI: {report['ui_tag']} ({report['ui_commit']})\n"
          text += f"- Compatibility: {json.dumps(report['compatibility'])}\n"
          text += "- Published binary SHA256, exact engine/API version and modular workflow smoke: passed\n"
          text += "- Both releases, installers and update manifests verified\n"
          Path("release-train-summary.md").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-train-summary-${{ inputs.agent_tag }}-${{ inputs.ui_tag }}
          path: |
            release-train-summary.md
            release-pair.json
