name: Agent Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build wheel and sdist (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: python -m build

      - name: Build standalone medpilot-agent executable
        run: pyinstaller --onefile --name medpilot-agent scripts/medpilot_agent_entry.py

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/medpilot-agent.exe release-artifacts/
          else
            cp dist/medpilot-agent release-artifacts/
          fi
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp dist/*.whl release-artifacts/
            cp dist/*.tar.gz release-artifacts/
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          out = []
          for path in sorted(Path("release-artifacts").glob("*")):
              if path.is_file():
                  digest = sha256(path.read_bytes()).hexdigest()
                  out.append(f"{digest}  {path.name}")
          Path("release-artifacts/SHA256SUMS.txt").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Upload per-OS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medpilot-agent-${{ matrix.os }}
          path: release-artifacts/*

  publish-pypi:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && secrets.PYPI_API_TOKEN != ''
    steps:
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: medpilot-agent-ubuntu-latest
          path: pypi-artifacts

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-artifacts

  publish-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: medpilot-agent-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*
