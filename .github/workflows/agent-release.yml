name: Agent Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov aiohttp ruff build pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build wheel and sdist (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: python -m build

      - name: Build standalone mira-engine executable
        run: pyinstaller --onefile --name mira-engine scripts/mira_engine_entry.py

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/mira-engine.exe release-artifacts/mira-engine-windows-x86_64.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ARCH="$(uname -m)"
            cp dist/mira-engine release-artifacts/mira-engine-macos-${ARCH}
          else
            cp dist/mira-engine release-artifacts/mira-engine-linux-x86_64
          fi
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp dist/*.whl release-artifacts/
            cp dist/*.tar.gz release-artifacts/
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          out = []
          for path in sorted(Path("release-artifacts").glob("*")):
              if path.is_file():
                  digest = sha256(path.read_bytes()).hexdigest()
                  out.append(f"{digest}  {path.name}")
          Path("release-artifacts/SHA256SUMS.txt").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Upload per-OS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mira-engine-${{ matrix.os }}
          path: release-artifacts/*

  publish-pypi:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: mira-engine-ubuntu-latest
          path: pypi-artifacts

      - name: Keep only package files
        shell: bash
        run: |
          mkdir -p pypi-packages
          cp pypi-artifacts/*.whl pypi-packages/ || true
          cp pypi-artifacts/*.tar.gz pypi-packages/ || true
          ls -al pypi-packages
          test -n "$(ls -A pypi-packages)"

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-packages
          skip-existing: true
          verbose: true

  publish-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mira-engine-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*
